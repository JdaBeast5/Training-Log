<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Liftnext icon (v3.516, "Sash"): the five plate inks as one rising band, in weight order from the top
       (25 red, 20 blue, 15 yellow, 10 green, 5 white). Flat ink ground, no gradient, no glow, no text.
       Ground-coloured gaps part every band, so red and blue still separate in Tinted and Grayscale. -->
  <rect width="1024" height="1024" fill="#0C0C0D"/>
  <g transform="rotate(-30 512 512)">
    <rect x="-400" y="266" width="1824" height="84" fill="#D42F25"/>
    <rect x="-400" y="368" width="1824" height="84" fill="#2C5BD8"/>
    <rect x="-400" y="470" width="1824" height="84" fill="#F2C200"/>
    <rect x="-400" y="572" width="1824" height="84" fill="#1E9E4A"/>
    <rect x="-400" y="674" width="1824" height="84" fill="#E6E6E2"/>
  </g>
</svg>
