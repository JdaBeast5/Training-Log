<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Option B small mark: the tile itself, because the sash only means something inside its ink square. -->
  <defs><clipPath id="t"><rect width="24" height="24" rx="5.4"/></clipPath></defs>
  <g clip-path="url(#t)">
    <rect width="24" height="24" fill="#0C0C0D"/>
    <g transform="rotate(-30 12 12)">
      <rect x="-10" y="6" width="44" height="2.1" fill="#D42F25"/>
      <rect x="-10" y="8.5" width="44" height="2.1" fill="#2C5BD8"/>
      <rect x="-10" y="11" width="44" height="2.1" fill="#F2C200"/>
      <rect x="-10" y="13.5" width="44" height="2.1" fill="#1E9E4A"/>
      <rect x="-10" y="16" width="44" height="2.1" fill="#E6E6E2"/>
    </g>
  </g>
</svg>
