<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Option A small header mark (16-24 px): the plates and sleeve without the tile, gaps widened for small
       sizes. The sleeve and the white plate's keyline take currentColor, so it sits on light or dark headers.
       It cannot sit bare on a day-ink card (the matching plate vanishes), so cards use mark-a-tile.svg. -->
  <rect x="5" y="10.8" width="18" height="2.4" rx=".6" fill="currentColor" opacity=".45"/>
  <rect x="2" y="2" width="3.6" height="20" rx=".7" fill="#D42F25"/>
  <rect x="6.8" y="2" width="3.2" height="20" rx=".7" fill="#2C5BD8"/>
  <rect x="11.2" y="2" width="2.8" height="20" rx=".7" fill="#F2C200"/>
  <rect x="15.2" y="2" width="2.4" height="20" rx=".7" fill="#1E9E4A"/>
  <rect x="18.8" y="7" width="2" height="10" rx=".6" fill="#E6E6E2" stroke="currentColor" stroke-opacity=".55" stroke-width=".6"/>
</svg>
