<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Race Bib: session-complete story card (1080×1920)</title>
<link rel="stylesheet" href="../../directions/base.css">
<!-- Story card in the Race Bib world: the finished session as the bib you'd pin on, on the day's plate colour.
     Bib number = this person's session count (from activity dates); "Finished" = session time, read like a chip time;
     tear-off tabs = sets, lifts, load lifted. No body data (MKT-02). Key content between y=250 and y=1620.
     Progression truth: Bench holds at 160 until all 4 sets reach 6 (BL-08). No record claimed.
     Sample data: session count 47, today's reps, time, load lifted. Name "Chalklog" pending owner (D7). -->
<style>
  body{width:1080px; height:1920px; overflow:hidden; position:relative; background:#D42F25; font-family:'Geist',sans-serif; -webkit-font-smoothing:antialiased;}
  .bn{font-family:'Archivo',sans-serif; font-stretch:100%; font-weight:900; font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.02em;}
  .bib{position:absolute; left:90px; top:250px; width:900px; height:1250px; background:#FBFBF8; color:#111110; transform:rotate(-2.5deg);
       box-shadow:0 40px 60px -30px rgba(60,0,0,.55);}
  .band{background:#111110; color:#fff; height:132px; padding:0 48px; display:flex; align-items:center; justify-content:space-between;}
  .band b{font-size:34px; font-weight:700; letter-spacing:.08em;}
  .band span{font-size:32px; font-weight:600;}
  .day{text-align:center; font-size:44px; font-weight:700; margin-top:40px;}
  .num{text-align:center; font-size:400px; line-height:.82; margin-top:22px;}
  .lab{text-align:center; font-size:34px; font-weight:600; color:#55554F; margin-top:14px;}
  .fin{display:flex; justify-content:center; align-items:baseline; gap:20px; margin-top:34px;}
  .fin span{font-size:36px; font-weight:600;}
  .fin .bn{font-size:96px;}
  .lift{margin:34px 48px 0; padding-top:26px; border-top:3px solid #111110; display:flex; justify-content:space-between; align-items:baseline;}
  .lift b{font-size:40px;}
  .lift .bn{font-size:54px;}
  .lift .bn small{font-family:'Geist'; font-size:30px; font-weight:600; margin-left:4px;}
  .note{margin:10px 48px 0; font-size:32px; line-height:1.3;}
  .note b{color:#B8261D;}
  .perf{position:absolute; left:0; right:0; bottom:176px; border-top:4px dashed #85857E;}
  .perf::before,.perf::after{content:''; position:absolute; top:-16px; width:28px; height:28px; border-radius:14px; background:#D42F25;}
  .perf::before{left:-14px;} .perf::after{right:-14px;}
  .tabs{position:absolute; left:0; right:0; bottom:0; height:176px; display:grid; grid-template-columns:repeat(3,1fr);}
  .tabs div{display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:4px dashed #85857E;}
  .tabs div:first-child{border-left:0;}
  .tabs .bn{font-size:72px; line-height:1;}
  .tabs span:not(.bn){font-size:30px; font-weight:600; color:#55554F; margin-top:6px;}
  .hole{position:absolute; width:26px; height:26px; border-radius:13px; background:#D42F25; box-shadow:inset 0 0 0 4px #C9C9C2;}
  .foot{position:absolute; left:96px; right:96px; top:1600px; display:flex; align-items:center; gap:22px; color:#fff; font-size:44px; font-weight:700;}
  .foot svg{width:76px; height:76px;}
</style>
</head>
<body>
<div class="bib">
  <div class="band"><b>STRENGTH &amp; SIZE · WK 3</b><span>7 Nov 2026</span></div>
  <span class="hole" style="left:30px; top:160px"></span><span class="hole" style="right:30px; top:160px"></span>
  <span class="hole" style="left:30px; bottom:208px"></span><span class="hole" style="right:30px; bottom:208px"></span>
  <p class="day">Day 1 · Upper Strength</p>
  <div class="num bn">47</div>
  <p class="lab">Session 47 on the log</p>
  <div class="fin"><span>Finished</span><span class="bn">58:12</span></div>
  <div class="lift"><b>Bench Press</b><span class="bn">160<small>lb</small> × 6, 6, 5, 5</span></div>
  <p class="note"><b>2 of 4 sets at the top.</b> Two more and it’s 165.</p>
  <div class="perf" aria-hidden="true"></div>
  <div class="tabs">
    <div><span class="bn">20</span><span>sets</span></div>
    <div><span class="bn">6</span><span>lifts</span></div>
    <div><span class="bn">17,020</span><span>lb lifted</span></div>
  </div>
</div>
<div class="foot">
  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  
  <rect x="1" y="2" width="22" height="20" rx="2.4" fill="#0C0C0D"/>
  <rect x="2.1" y="3.1" width="3.32" height="17.8" rx=".6" fill="#D42F25"/>
  <rect x="6.22" y="3.1" width="3.32" height="17.8" rx=".3" fill="#2C5BD8"/>
  <rect x="10.34" y="3.1" width="3.32" height="17.8" rx=".3" fill="#F2C200"/>
  <rect x="14.46" y="3.1" width="3.32" height="17.8" rx=".3" fill="#1E9E4A"/>
  <rect x="18.58" y="3.1" width="3.32" height="17.8" rx=".6" fill="#E6E6E2"/>
</svg>

  Chalklog
</div>
<script>document.fonts.ready.then(()=>window.__done=true)</script></body>
</html>
