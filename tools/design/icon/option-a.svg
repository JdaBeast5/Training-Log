<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Option A, "Sleeve": a loaded bar end seen from the side. The five plate inks in weight order
       (25 red, 20 blue, 15 yellow, 10 green, 5 white), thickest against the collar, on a dark-steel sleeve.
       Flat ink ground, no gradient, no glow, no text. Every plate is cut from the next by a strip of ground,
       so red and blue (near-equal luminance) still read as two shapes in Tinted and Grayscale. -->
  <rect width="1024" height="1024" fill="#0C0C0D"/>
  <g fill="#46464A">
    <rect x="0" y="494" width="240" height="36"/>
    <rect x="226" y="402" width="44" height="220" rx="8"/>
    <rect x="270" y="482" width="590" height="60" rx="10"/>
  </g>
  <rect x="284" y="212" width="100" height="600" rx="14" fill="#D42F25"/>
  <rect x="408" y="212" width="84" height="600" rx="14" fill="#2C5BD8"/>
  <rect x="516" y="212" width="70" height="600" rx="14" fill="#F2C200"/>
  <rect x="610" y="212" width="58" height="600" rx="14" fill="#1E9E4A"/>
  <rect x="692" y="362" width="48" height="300" rx="12" fill="#E6E6E2"/>
</svg>
