<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>A · Plate &amp; Press: session-complete story card (1080×1920)</title>
<link rel="stylesheet" href="../world.css">
<!-- Direction A's session card. Since the owner chose the bib as the story card (design-directions §5, MKT-16), this grid
     is the square card for messages; drawn here at story size for comparison. Drawn on the device (MKT-03/MKT-04).
     No body data (MKT-02). Updated 2026-11-08 for gate G4: the figures lead with sets, then lifts and minutes; total
     load is off by default (D15; the old third figure was "17.0 k lb Lifted"). The foot is the Sash tile beside the
     wordmark Platestep (naming.md, owner 2026-11-07); no address yet (BIZ-08 is behind the Phase 3 gate, D16).
     Safe zones: key content stays between y=250 and y=1620 (Instagram/WhatsApp chrome).
     Progression truth: Bench holds at 160 until all 4 sets reach 6 (BL-08); today 5, 6, 6, 5 (set 1 was 160 × 5, as on the Today
     mock-up) = 2 of 4 at the top.
     No record is claimed: 160 was already lifted last session, so it is neither a weight nor an e1RM record.
     Sample data: today's reps, session time. -->
<style>
  body{width:1080px; height:1920px; background:#0C0C0D; color:#F2F2F0; overflow:hidden; position:relative;}
  .field{background:var(--spot-red); color:#fff; padding:250px 84px 60px;}
  .kick{font-size:40px; font-weight:500; display:flex; justify-content:space-between;}
  h1{font-size:150px; margin-top:28px; line-height:.88;}
  .bar{margin:56px auto 0; width:720px;}
  .bar svg{width:100%; display:block;}
  .lift{margin-top:44px; display:flex; justify-content:space-between; align-items:baseline;}
  .lift h2{font-size:48px; font-weight:600;}
  .lift .fig{font-size:60px; font-stretch:68%; font-weight:800;}
  .lift .fig small{font-family:var(--font-text); font-size:30px; font-weight:600; margin-left:6px;}
  .reps{display:flex; gap:14px; margin-top:20px;}
  .reps span{flex:1; height:84px; border-radius:16px; display:grid; place-items:center; font-family:var(--font-display); font-stretch:68%; font-weight:800; font-size:54px;}
  .reps .top{background:#fff; color:#B8261D;}
  .reps .under{border:3px solid #fff; color:#fff;}
  .note{font-size:36px; line-height:1.3; margin-top:24px;}
  .note b{font-weight:700;}
  .ink{padding:52px 84px 0;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); border-top:2px solid #3A3A3E; border-bottom:2px solid #3A3A3E;}
  .stats div{padding:28px 0 24px;}
  .stats div+div{padding-left:40px; border-left:2px solid #3A3A3E;}
  .stats .fig{font-size:116px; line-height:.9; font-stretch:68%; font-weight:800;}
  .stats .fig small{font-family:var(--font-text); font-size:32px; font-weight:600; color:#A6A6A2; margin-left:8px;}
  .stats p{font-size:32px; color:#A6A6A2; margin-top:10px;}
  .foot{position:absolute; left:84px; right:84px; top:1650px; display:flex; align-items:center; gap:22px; font-size:42px; font-weight:600;}
  .foot svg{width:72px; height:72px;}
  .foot svg{border-radius:16px; box-shadow:0 0 0 2px #3A3A3E;}
</style>
</head>
<body>
<section class="field">
  <div class="kick"><span>Strength &amp; Size · Week 3</span><span>Day 1</span></div>
  <h1 class="display">Upper Strength,<br>done.</h1>
  <div class="bar">
    <svg viewBox="0 0 362 92" aria-hidden="true">
      <rect x="1" y="39" width="117" height="14" rx="2" fill="#BDBDB8" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="244" y="39" width="117" height="14" rx="2" fill="#BDBDB8" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="116" y="42" width="130" height="8" fill="#BDBDB8" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="110" y="30" width="8" height="32" rx="1" fill="#1B1B1D"/><rect x="244" y="30" width="8" height="32" rx="1" fill="#1B1B1D"/>
      <rect x="86" y="0" width="24" height="92" rx="3" fill="#2C5BD8" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="70" y="12" width="16" height="68" rx="3" fill="#E6E6E2" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="62" y="24" width="8" height="44" rx="2" fill="#8B8B88" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="55" y="34" width="7" height="24" rx="1" fill="#1B1B1D"/>
      <rect x="252" y="0" width="24" height="92" rx="3" fill="#2C5BD8" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="276" y="12" width="16" height="68" rx="3" fill="#E6E6E2" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="292" y="24" width="8" height="44" rx="2" fill="#8B8B88" stroke="#0C0C0D" stroke-width="2"/>
      <rect x="300" y="34" width="7" height="24" rx="1" fill="#1B1B1D"/>
    </svg>
  </div>
  <div class="lift"><h2>Bench Press</h2><span class="fig">160<small>lb · 45 · 10 · 2.5 a side</small></span></div>
  <div class="reps" aria-label="Reps per set: 5, 6, 6, 5"><span class="under">5</span><span class="top">6</span><span class="top">6</span><span class="under">5</span></div>
  <p class="note"><b>2 of 4 sets at the top of 4–6.</b> Two more and it’s 165.</p>
</section>
<section class="ink">
  <div class="stats">
    <div><div class="fig">20</div><p>Sets</p></div>
    <div><div class="fig">6</div><p>Lifts</p></div>
    <div><div class="fig">58<small>min</small></div><p>Time</p></div>
  </div>
</section>
<div class="foot">
  <svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="sash-t"><rect width="24" height="24" rx="5.4"/></clipPath></defs><g clip-path="url(#sash-t)"><rect width="24" height="24" fill="#0C0C0D"/><g transform="rotate(-30 12 12)"><rect x="-10" y="6" width="44" height="2.1" fill="#D42F25"/><rect x="-10" y="8.5" width="44" height="2.1" fill="#2C5BD8"/><rect x="-10" y="11" width="44" height="2.1" fill="#F2C200"/><rect x="-10" y="13.5" width="44" height="2.1" fill="#1E9E4A"/><rect x="-10" y="16" width="44" height="2.1" fill="#E6E6E2"/></g></g></svg>
  Platestep
</div>
</body>
</html>
