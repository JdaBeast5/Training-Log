<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Court: session-complete story card (1080×1920)</title>
<link rel="stylesheet" href="base.css">
<!-- Story card in the Court world: the session drawn as a floor plan. The centre circle holds the session's count of
     sets; each exercise is a lane; each set is one painted stroke across its lane, its length the reps against the
     top of the range. No body data (MKT-02). Safe zones: key content between y=250 and y=1620.
     Progression truth: Bench holds at 160 until all 4 sets reach 6 (BL-08). No record claimed.
     Sample data: today's reps, loads, session time. Name "Chalklog" pending owner (D7). -->
<style>
  body{width:1080px; height:1920px; overflow:hidden; position:relative; background:#0E3B34; color:#F3F1EA; font-family:'Geist',sans-serif; -webkit-font-smoothing:antialiased;}
  .wide{font-family:'Archivo',sans-serif; font-stretch:125%; font-variant-numeric:tabular-nums lining-nums;}
  .court{position:absolute; inset:0;}
  .court svg{width:100%; height:100%;}
  .top{position:absolute; left:96px; right:96px; top:250px;}
  .top p{font-size:38px; font-weight:500; color:#BFD0CA;}
  .top h1{font-size:96px; font-weight:700; line-height:1; margin-top:18px; letter-spacing:-.01em;}
  .circle{position:absolute; left:50%; top:560px; width:440px; height:440px; transform:translateX(-50%); display:grid; place-items:center; text-align:center;}
  .circle .n{font-size:200px; font-weight:600; line-height:.9;}
  .circle .l{font-size:36px; font-weight:600; margin-top:8px;}
  .lanes{position:absolute; left:96px; right:96px; top:1060px;}
  .lane{display:grid; grid-template-columns:330px 1fr 150px; align-items:center; height:72px; border-top:3px solid rgba(243,241,234,.35);}
  .lane:last-child{border-bottom:3px solid rgba(243,241,234,.35);}
  .lane .name{font-size:34px; font-weight:600;}
  .lane .strokes{display:flex; gap:14px; align-items:center;}
  .lane .strokes i{height:12px; border-radius:6px; background:#F3F1EA;}
  .lane .ld{text-align:right; font-size:40px; font-weight:600;}
  .lane.hot .name,.lane.hot .ld{color:#F4C430;}
  .lane.hot .strokes i{background:#F4C430;}
  .lane .strokes i.short{background:transparent; border:3px solid rgba(243,241,234,.8);}
  .lane.hot .strokes i.short{border-color:#F4C430;}
  .note{position:absolute; left:96px; right:96px; top:1520px; font-size:38px; line-height:1.3;}
  .note b{color:#F4C430; font-weight:700;}
  .foot{position:absolute; left:96px; right:96px; top:1700px; display:flex; align-items:center; gap:22px; font-size:42px; font-weight:600;}
  .foot svg{width:72px; height:72px;}
  .foot span{margin-left:auto; font-size:34px; font-weight:500; color:#BFD0CA;}
</style>
</head>
<body>
<div class="court" aria-hidden="true">
  <svg viewBox="0 0 1080 1920">
    <g fill="none" stroke="#F3F1EA" stroke-width="6">
      <rect x="40" y="40" width="1000" height="1840"/>
      <line x1="40" y1="780" x2="300" y2="780"/><line x1="780" y1="780" x2="1040" y2="780"/>
      <circle cx="540" cy="780" r="220"/>
    </g>
    <g fill="none" stroke="#F4C430" stroke-width="6" stroke-dasharray="28 20" opacity=".9">
      <circle cx="540" cy="780" r="250"/>
    </g>
  </svg>
</div>
<div class="top"><p>Strength &amp; Size · Week 3 · Day 1</p><h1 class="wide">Upper Strength</h1></div>
<div class="circle"><div><div class="n wide">20</div><div class="l">sets · 58 min</div></div></div>
<div class="lanes" role="list" aria-label="Exercises">
  <div class="lane hot" role="listitem"><span class="name">Bench Press</span><span class="strokes" aria-label="6, 6, 5, 5"><i style="width:84px"></i><i style="width:84px"></i><i class="short" style="width:70px"></i><i class="short" style="width:70px"></i></span><span class="ld wide">160</span></div>
  <div class="lane" role="listitem"><span class="name">Barbell Row</span><span class="strokes"><i style="width:84px"></i><i style="width:84px"></i><i style="width:84px"></i><i class="short" style="width:74px"></i></span><span class="ld wide">135</span></div>
  <div class="lane" role="listitem"><span class="name">Overhead Press</span><span class="strokes"><i style="width:84px"></i><i class="short" style="width:76px"></i><i class="short" style="width:68px"></i></span><span class="ld wide">100</span></div>
  <div class="lane" role="listitem"><span class="name">Lat Pulldown</span><span class="strokes"><i style="width:84px"></i><i style="width:84px"></i><i class="short" style="width:77px"></i></span><span class="ld wide">125</span></div>
  <div class="lane" role="listitem"><span class="name">DB Curl</span><span class="strokes"><i style="width:84px"></i><i class="short" style="width:77px"></i><i class="short" style="width:70px"></i></span><span class="ld wide">30</span></div>
  <div class="lane" role="listitem"><span class="name">Pushdown</span><span class="strokes"><i style="width:84px"></i><i style="width:84px"></i><i class="short" style="width:77px"></i></span><span class="ld wide">50</span></div>
</div>
<p class="note"><b>Bench: 2 of 4 sets at the top.</b><br>Two more and the bar goes to 165.</p>
<div class="foot">
  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M73.7 32.8A30 30 0 1 1 49.8 20" fill="none" stroke="#F3F1EA" stroke-width="10"/><path d="M50 20A30 30 0 0 1 72.9 31.6" fill="none" stroke="#F4C430" stroke-width="10"/><circle cx="50" cy="50" r="5" fill="#F3F1EA"/></svg>
  Chalklog<span>Loads in lb</span>
</div>
</body>
</html>
