<!doctype html>

<title>C · Race Bib: the session bib story card (1080×1920)</title>
<link rel="stylesheet" href="base.css">
<!-- The session bib (MKT-16), the story card the owner chose (design-directions §5, marketing.md §3.4).
     Rebuilt 2026-11-08 for consensus gate G4, per marketing's notes and the decisions since:
     - event band: one tracked-caps line, [Sash tile] PLATESTEP · STRENGTH & SIZE · WK 3, the name in the event slot,
       framed by the mark (owner's name decision, 2026-11-07; Sash = option B, v3.516). The name appears once per card;
     - the big figure is "No. 47", the training-day number (MKT-17), never a load, so nothing reads as a command;
     - the loaded bar sits under the number, mandatory on barbell days: with "chalk" gone it's the bib's lifting signal.
       UX-07's plates for 160 lb, 45 · 10 · 2.5 a side, heaviest against the inner collar;
     - no "Finished 58:12": a race-style claim with no seconds data behind it outside Gym mode;
     - tear-off tabs lead with sets, then lifts and minutes; no total load (D15; the old third tab was "17,020 lb lifted");
     - ground = the day's ink from dayInk (D13): Day 1's plate p-red → red;
     - no address: the sponsor strip at the bib's foot stays empty until BIZ-08 (D16; December 2026 is a dogfood run).
     Progression truth: Bench holds at 160 until all 4 sets reach 6 (BL-08); today 5, 6, 6, 5 (set 1 = 160 × 5, as on
     the Today mock-up). No record claimed. No body data (MKT-02). Key content between y=250 and y=1620.
     Sample data: training-day number 47, today's reps and minutes. -->
<style>
  body{width:1080px; height:1920px; overflow:hidden; position:relative; background:#D42F25; font-family:'Geist',sans-serif; -webkit-font-smoothing:antialiased;}
  .bn{font-family:'Archivo',sans-serif; font-stretch:100%; font-weight:900; font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.02em;}
  .bib{position:absolute; left:90px; top:262px; width:900px; height:1260px; background:#FBFBF8; color:#111110; transform:rotate(-2.5deg);
       box-shadow:0 40px 60px -30px rgba(60,0,0,.55);}
  .band{background:#111110; color:#fff; height:124px; padding:0 40px; display:flex; align-items:center; gap:22px;}
  .band svg{width:64px; height:64px; flex:none; border-radius:14px; box-shadow:0 0 0 2px #3A3A3E;}
  .band b{font-size:31px; font-weight:700; letter-spacing:.09em; white-space:nowrap;}
  .day{display:flex; justify-content:space-between; font-size:34px; font-weight:600; margin:34px 70px 0; color:#33332F;}
  .num{display:flex; justify-content:center; align-items:baseline; gap:18px; margin-top:6px;}
  .num .no{font-size:110px; letter-spacing:0;}
  .num .n{font-size:390px; line-height:.86;}
  .lab{text-align:center; font-size:32px; font-weight:600; color:#55554F; margin-top:6px;}
  .bar{width:720px; height:160px; margin:40px auto 0;}
  .bar svg{width:100%; height:100%; display:block;}
  .cap{text-align:center; font-size:28px; font-weight:600; color:#55554F; margin-top:12px;}
  .lift{margin:30px 56px 0; padding-top:24px; border-top:3px solid #111110; display:flex; justify-content:space-between; align-items:baseline;}
  .lift b{font-size:40px;}
  .lift .bn{font-size:54px;}
  .lift .bn small{font-family:'Geist'; font-size:30px; font-weight:600; margin-left:4px;}
  .note{margin:10px 56px 0; font-size:32px; line-height:1.3;}
  .note b{color:#B8261D;}
  .perf{position:absolute; left:0; right:0; bottom:176px; border-top:4px dashed #85857E;}
  .perf::before,.perf::after{content:''; position:absolute; top:-16px; width:28px; height:28px; border-radius:14px; background:#D42F25;}
  .perf::before{left:-14px;} .perf::after{right:-14px;}
  .tabs{position:absolute; left:0; right:0; bottom:0; height:176px; display:grid; grid-template-columns:repeat(3,1fr);}
  .tabs div{display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:4px dashed #85857E;}
  .tabs div:first-child{border-left:0;}
  .tabs .bn{font-size:72px; line-height:1;}
  .tabs span:not(.bn){font-size:30px; font-weight:600; color:#55554F; margin-top:6px;}
  .hole{position:absolute; width:26px; height:26px; border-radius:13px; background:#D42F25; box-shadow:inset 0 0 0 4px #C9C9C2;}
</style>
</head>
<body>
<div class="bib">
